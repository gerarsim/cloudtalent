services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudtalent
      POSTGRES_USER: cloudtalent
      POSTGRES_PASSWORD: cloudtalent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtalent -d cloudtalent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cloudtalent:cloudtalent@db:5432/cloudtalent
      SEED_DEMO: "true"
      # Dev uniquement : à remplacer (et à garder secret) hors poste local
      SECRET_KEY: dev-secret-change-me
      ADMIN_EMAIL: admin@cloudtalent.lu
      ADMIN_PASSWORD: admin1234
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      # Le proxy Vite relaie /api vers le backend : plus d'URL en dur dans le code
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
